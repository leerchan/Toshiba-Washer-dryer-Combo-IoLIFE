# Toshiba washer (toshiba_washer integration) Live Activity blueprint
# Import: Settings → Automations & Scenes → Blueprints → Import Blueprint → paste this file's GitHub URL; then create an automation from it and pick each entity.
blueprint:
  name: Toshiba washer Live Activity
  description: >
    Pushes the course progress to the Companion app as an iOS Live Activity / Android live notification: alerts on each stage change and quietly advances the progress every 5 minutes while running, plus error and filter-cleaning reminders. Pick each entity; nothing depends on entity ID naming.
  domain: automation
  source_url: https://github.com/leerchan/Toshiba-Washer-dryer-Combo-IoLIFE/blob/main/examples/live_activity.en.yaml
  input:
    notify_target:
      name: Notify action
      description: The notify action of a phone or notify group, e.g. notify.mobile_app_iphone
      selector:
        text:
    status_entity:
      name: Status
      selector: &sensor
        entity:
          filter:
            - integration: toshiba_washer
              domain: sensor
    stage_entity:
      name: Stage
      selector: *sensor
    finish_time_entity:
      name: Finish time
      selector:
        entity:
          filter:
            - integration: toshiba_washer
              domain: sensor
              device_class: timestamp
    mode_entity:
      name: Mode
      selector: *sensor
    program_entity:
      name: Program
      selector: *sensor
    error_code_entity:
      name: Error code
      selector: *sensor
    door_entity:
      name: Door
      selector:
        entity:
          filter:
            - integration: toshiba_washer
              domain: binary_sensor
              device_class: door
    drain_filter_entity:
      name: Drain filter needs cleaning
      selector: &problem
        entity:
          filter:
            - integration: toshiba_washer
              domain: binary_sensor
              device_class: problem
    dryer_filter_entity:
      name: Dryer filter needs cleaning
      selector: *problem
mode: queued
triggers:
  - trigger: state # wash → rinse → spin → dry → soft keep; the first stage after starting also lands here
    entity_id: !input stage_entity
    not_to: [unknown, unavailable]
    id: stage
  - trigger: state # resumed after pause (stage unchanged, so the trigger above does not fire)
    entity_id: !input status_entity
    from: pause
    to: start
    id: stage
  - trigger: time_pattern # while running, silently advance the progress bar every 5 minutes
    minutes: /5
    id: tick
  - trigger: state
    entity_id: !input status_entity
    to: pause
    id: pause
  - trigger: state
    entity_id: !input status_entity
    to: end
    id: end
  - trigger: state # cancelled midway / switched off
    entity_id: !input status_entity
    from: [start, pause]
    to: [idle, standby]
    id: clear
  - trigger: state # door opened after finishing to take the laundry out → dismiss the card
    entity_id: !input door_entity
    to: "on"
    id: door
  - trigger: state
    entity_id: !input error_code_entity
    not_to: ["0", unknown, unavailable]
    id: error
  - trigger: state # filter needs cleaning → remind; cleaned → dismiss
    entity_id:
      - !input drain_filter_entity
      - !input dryer_filter_entity
    from: ["on", "off"]
    to: ["on", "off"]
    id: filter
variables:
  notify_target: !input notify_target
  status_entity: !input status_entity
  stage_entity: !input stage_entity
  finish_time_entity: !input finish_time_entity
  mode_entity: !input mode_entity
  program_entity: !input program_entity
  dryer_filter_entity: !input dryer_filter_entity
  stage: "{{ states(stage_entity) }}"
  mode: "{{ states(mode_entity) }}"
  names: { wash: Wash, rinse: Rinse, spin: Spin, dry: Dry, soft_keep: Soft keep }
  # Share of the progress bar each stage takes per mode [start, end]; soft keep is not counted, entering it means 100
  bands:
    wash_dry: { wash: [0, 25], rinse: [25, 45], spin: [45, 60], dry: [60, 100] }
    wash: { wash: [0, 40], rinse: [40, 70], spin: [70, 100] }
    dry: { dry: [0, 100] }
  band: "{{ bands.get(mode, bands.wash_dry).get(stage, [0, 5]) }}"
  # Within a band, progress follows time: stage elapsed / (elapsed + stage time left),
  # stage time left = total time left × this stage's share of the remaining progress. Stops short of the band end, never fills early.
  # ponytail: stage elapsed comes from last_changed, so after an HA restart it restarts from the band start
  progress: >
    {% if stage == 'soft_keep' %}100{% else %}
    {% set lo, hi = band[0], band[1] %}
    {% set t = as_timestamp(now()) - as_timestamp((expand(stage_entity) | first).last_changed) %}
    {% set end = as_timestamp(states(finish_time_entity), 0) %}
    {% set stage_left = [end - as_timestamp(now()), 0] | max * (hi - lo) / (100 - lo) %}
    {% set p = lo + (hi - lo) * t / (t + stage_left) if end and t + stage_left > 0 else lo %}
    {{ [p | int, hi - 1] | min }}{% endif %}
  title: "Washer · {{ state_translated(mode_entity) }}"
  icon: "{{ 'mdi:tumble-dryer' if mode == 'dry' else 'mdi:washing-machine' }}"
  program: "{{ state_translated(program_entity) }}"
  end_ts: "{{ as_timestamp(states(finish_time_entity), 0) | int }}"
actions:
  - choose:
      - conditions: >
          {{ trigger.id in ['stage', 'tick'] and is_state(status_entity, 'start') }}
        sequence:
          - action: "{{ notify_target }}"
            data:
              title: "{{ title }}"
              message: "{{ program }} · {{ names.get(stage, 'Running') }}"
              # A stage change pops up an alert; the periodic update adds silent / alert_once so it stays quiet
              data: >
                {% set d = dict(tag='toshiba_washer', live_update=true,
                     critical_text=names.get(stage, 'Running'),
                     progress=progress, progress_max=100, notification_icon=icon,
                     notification_icon_color='#2196F3', color='#2196F3') %}
                {% if end_ts > as_timestamp(now()) %}
                  {% set d = dict(d, chronometer=true, when=end_ts) %}
                {% endif %}
                {% if trigger.id == 'tick' %}
                  {% set d = dict(d, silent=true, alert_once=true) %}
                {% endif %}
                {{ d }}
      - conditions: "{{ trigger.id == 'pause' }}"
        sequence:
          - action: "{{ notify_target }}"
            data:
              title: "{{ title }}"
              message: "{{ program }} · Paused"
              data:
                tag: toshiba_washer
                live_update: true
                critical_text: Paused
                progress: "{{ progress }}"
                progress_max: 100
                notification_icon: mdi:pause-circle
                notification_icon_color: "#FF9800"
                color: "#FF9800"
      - conditions: "{{ trigger.id == 'end' }}"
        sequence:
          - action: "{{ notify_target }}"
            data:
              title: "{{ title }}"
              message: "{{ program }} · Done, time to take the laundry out"
              data:
                tag: toshiba_washer
                live_update: true
                critical_text: Done
                progress: 100
                progress_max: 100
                notification_icon: mdi:check-circle
                notification_icon_color: "#4CAF50"
                color: "#4CAF50"
      - conditions: "{{ trigger.id == 'error' }}"
        sequence:
          # A separate regular notification: plays a sound and arrives immediately, but does not break through Do Not Disturb / Focus
          - action: "{{ notify_target }}"
            data:
              title: Washer error
              message: "Error code {{ trigger.to_state.state }}, please check the washer"
              data:
                tag: toshiba_washer_error
                push:
                  interruption-level: active
                  sound: default
                ttl: 0
                priority: high
      - conditions: "{{ trigger.id == 'filter' and trigger.to_state.state == 'on' }}"
        sequence:
          - action: "{{ notify_target }}"
            data:
              title: Washer
              message: >
                {{ 'Dryer' if trigger.entity_id == dryer_filter_entity else 'Drain' }} filter needs cleaning
              data:
                tag: "toshiba_washer_{{ trigger.to_state.object_id }}"
                notification_icon: mdi:air-filter
      - conditions: "{{ trigger.id == 'filter' }}" # back to off: cleaned
        sequence:
          - action: "{{ notify_target }}"
            data:
              message: clear_notification
              data:
                tag: "toshiba_washer_{{ trigger.to_state.object_id }}"
      - conditions: >
          {{ trigger.id == 'clear'
             or (trigger.id == 'door' and is_state(status_entity, 'end')) }}
        sequence:
          - action: "{{ notify_target }}"
            data:
              message: clear_notification
              data:
                tag: toshiba_washer
