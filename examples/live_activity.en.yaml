# Toshiba washer (toshiba_washer integration) Live Activity
# Settings → Automations → Create → ⋮ → Edit in YAML → paste.
# Entities use the default names sensor.washer_*; if you renamed the device, replace "washer_" everywhere.
alias: Toshiba washer Live Activity
mode: queued
triggers:
  - trigger: state # wash → rinse → spin → dry → soft keep; the first stage after starting also lands here
    entity_id: sensor.washer_stage
    not_to: [unknown, unavailable]
    id: stage
  - trigger: state # resumed after pause (stage unchanged, so the trigger above does not fire)
    entity_id: sensor.washer_status
    from: pause
    to: start
    id: stage
  - trigger: time_pattern # while running, silently advance the progress bar every 5 minutes
    minutes: /5
    id: tick
  - trigger: state
    entity_id: sensor.washer_status
    to: pause
    id: pause
  - trigger: state
    entity_id: sensor.washer_status
    to: end
    id: end
  - trigger: state # cancelled midway / switched off
    entity_id: sensor.washer_status
    from: [start, pause]
    to: [idle, standby]
    id: clear
  - trigger: state # door opened after finishing to take the laundry out → dismiss the card
    entity_id: binary_sensor.washer_door
    to: "on"
    id: door
  - trigger: state
    entity_id: sensor.washer_error_code
    not_to: ["0", unknown, unavailable]
    id: error
  - trigger: state # filter needs cleaning → remind; cleaned → dismiss
    entity_id:
      - binary_sensor.washer_drain_filter_needs_cleaning
      - binary_sensor.washer_dryer_filter_needs_cleaning
    from: ["on", "off"]
    to: ["on", "off"]
    id: filter
variables:
  notify_target: notify.mobile_app_iphone # ← your phone's notify action
  stage: "{{ states('sensor.washer_stage') }}"
  mode: "{{ states('sensor.washer_mode') }}"
  names: { wash: Wash, rinse: Rinse, spin: Spin, dry: Dry, soft_keep: Soft keep }
  # Share of the progress bar each stage takes per mode [start, end]; soft keep is not counted, entering it means 100
  bands:
    wash_dry: { wash: [0, 25], rinse: [25, 45], spin: [45, 60], dry: [60, 100] }
    wash: { wash: [0, 40], rinse: [40, 70], spin: [70, 100] }
    dry: { dry: [0, 100] }
  band: "{{ bands.get(mode, bands.wash_dry).get(stage, [0, 5]) }}"
  # Within a band, progress follows time: stage elapsed / (elapsed + stage time left),
  # stage time left = total time left × this stage's share of the remaining progress. Stops short of the band end, never fills early.
  # ponytail: stage elapsed comes from last_changed, so after an HA restart it restarts from the band start
  progress: >
    {% if stage == 'soft_keep' %}100{% else %}
    {% set lo, hi = band[0], band[1] %}
    {% set t = as_timestamp(now()) - as_timestamp(states.sensor.washer_stage.last_changed) %}
    {% set end = as_timestamp(states('sensor.washer_finish_time'), 0) %}
    {% set stage_left = [end - as_timestamp(now()), 0] | max * (hi - lo) / (100 - lo) %}
    {% set p = lo + (hi - lo) * t / (t + stage_left) if end and t + stage_left > 0 else lo %}
    {{ [p | int, hi - 1] | min }}{% endif %}
  title: "Washer · {{ state_translated('sensor.washer_mode') }}"
  icon: "{{ 'mdi:tumble-dryer' if mode == 'dry' else 'mdi:washing-machine' }}"
  program: "{{ state_translated('sensor.washer_program') }}"
  end_ts: "{{ as_timestamp(states('sensor.washer_finish_time'), 0) | int }}"
actions:
  - choose:
      - conditions: >
          {{ trigger.id in ['stage', 'tick'] and is_state('sensor.washer_status', 'start') }}
        sequence:
          - action: "{{ notify_target }}"
            data:
              title: "{{ title }}"
              message: "{{ program }} · {{ names.get(stage, 'Running') }}"
              # A stage change pops up an alert; the periodic update adds silent / alert_once so it stays quiet
              data: >
                {% set d = dict(tag='toshiba_washer', live_update=true,
                     critical_text=names.get(stage, 'Running'),
                     progress=progress, progress_max=100, notification_icon=icon,
                     notification_icon_color='#2196F3', color='#2196F3') %}
                {% if end_ts > as_timestamp(now()) %}
                  {% set d = dict(d, chronometer=true, when=end_ts) %}
                {% endif %}
                {% if trigger.id == 'tick' %}
                  {% set d = dict(d, silent=true, alert_once=true) %}
                {% endif %}
                {{ d }}
      - conditions: "{{ trigger.id == 'pause' }}"
        sequence:
          - action: "{{ notify_target }}"
            data:
              title: "{{ title }}"
              message: "{{ program }} · Paused"
              data:
                tag: toshiba_washer
                live_update: true
                critical_text: Paused
                progress: "{{ progress }}"
                progress_max: 100
                notification_icon: mdi:pause-circle
                notification_icon_color: "#FF9800"
                color: "#FF9800"
      - conditions: "{{ trigger.id == 'end' }}"
        sequence:
          - action: "{{ notify_target }}"
            data:
              title: "{{ title }}"
              message: "{{ program }} · Done, time to take the laundry out"
              data:
                tag: toshiba_washer
                live_update: true
                critical_text: Done
                progress: 100
                progress_max: 100
                notification_icon: mdi:check-circle
                notification_icon_color: "#4CAF50"
                color: "#4CAF50"
      - conditions: "{{ trigger.id == 'error' }}"
        sequence:
          # A separate regular notification: plays a sound and arrives immediately, but does not break through Do Not Disturb / Focus
          - action: "{{ notify_target }}"
            data:
              title: Washer error
              message: "Error code {{ trigger.to_state.state }}, please check the washer"
              data:
                tag: toshiba_washer_error
                push:
                  interruption-level: active
                  sound: default
                ttl: 0
                priority: high
      - conditions: "{{ trigger.id == 'filter' and trigger.to_state.state == 'on' }}"
        sequence:
          - action: "{{ notify_target }}"
            data:
              title: Washer
              message: >
                {{ 'Dryer' if 'dryer' in trigger.entity_id else 'Drain' }} filter needs cleaning
              data:
                tag: "toshiba_washer_{{ trigger.to_state.object_id }}"
                notification_icon: mdi:air-filter
      - conditions: "{{ trigger.id == 'filter' }}" # back to off: cleaned
        sequence:
          - action: "{{ notify_target }}"
            data:
              message: clear_notification
              data:
                tag: "toshiba_washer_{{ trigger.to_state.object_id }}"
      - conditions: >
          {{ trigger.id == 'clear'
             or (trigger.id == 'door' and is_state('sensor.washer_status', 'end')) }}
        sequence:
          - action: "{{ notify_target }}"
            data:
              message: clear_notification
              data:
                tag: toshiba_washer
